# R01 - Baseline one-stage (pemilik: Tsabita)
run_id: R01
owner: Tsabita
model: yolov8s
paradigm: one-stage
factor: baseline
value: imgsz 640
pretrained: yolov8s.pt        # bobot COCO dari ultralytics
seed: 42
epochs: 60                    # HEMAT: 60 epoch (proposal awal 100); kurva val mendatar sebelum epoch 60
patience: 15                  # berhenti lebih awal bila val tidak membaik 15 epoch (hemat kuota)
imgsz: 640
batch: 16
optimizer: SGD
lr0: 0.01
momentum: 0.937
weight_decay: 0.0005
amp: true
# augmentasi dibuat SAMA untuk kedua model (perbandingan terkontrol)
augment:
  hflip: 0.5
  vflip: 0.5
  scale: 0.2                  # skala acak +-20%
  hue: 0.01                   # hue sangat kecil: warna membawa informasi pewarnaan
  saturation: 0.0
  value: 0.0
  mosaic: 0.0                 # dimatikan: Faster R-CNN tidak memakai mosaic
predict:
  conf: 0.001                 # ambang rendah untuk mAP; ambang hitung (tau) dipilih di validasi
  iou_nms: 0.7                # bawaan ultralytics
  max_det: 300
